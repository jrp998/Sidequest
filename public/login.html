<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in – Sidequest</title><style>body{font:16px system-ui;background:#f5f5ef;color:#233b40;display:grid;min-height:90vh;place-items:center;margin:0}main{width:min(360px,85vw)}h1{font:36px Georgia}label{display:block;margin-top:18px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:13px;border:1px solid #768481;border-radius:9px;margin-top:8px}button{background:#365e60;color:white;cursor:pointer;margin-top:24px}p{line-height:1.6}#status{min-height:24px}a{color:inherit}</style></head><body><main><h1>Sidequest</h1><p>Your tasks and projects, on every device.</p><form id="login"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Sign in</button><p id="status" role="status"></p></form><p>This is your independent Sidequest account. Use the same login on your phone and desktop.</p></main><script src="/login.js"></script></body></html>
